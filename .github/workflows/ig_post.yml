name: Post to Instagram

on:
  # PAUSED 2026-07-31 — Elena's Instagram account was suspended. Automatic posting
  # disabled to stop repeated "failed to post" notifications.
  # schedule:
  #   - cron: '5,20,35,50 * * * *'  # Every 15 min, at :05 (staggered from Elena/Sofia X)
  #
  # `workflow_dispatch` deliberately REMOVED 2026-08-07. An unidentified external
  # automation has been dispatching this workflow every 15 minutes since
  # 2026-04-13 and we cannot find what it is. With no dispatch trigger, its API
  # calls now fail with HTTP 422 ("Workflow does not have workflow_dispatch
  # trigger"), which should make the service report an error and reveal itself.
  #
  # `workflow_call` below is a placeholder: a workflow needs at least one valid
  # trigger, and nothing calls this one, so it never fires on its own.
  workflow_call: {}

concurrency:
  group: post-to-instagram
  cancel-in-progress: false  # Queue, don't cancel — let each run finish cleanly

jobs:
  post:
    # HARD PAUSE 2026-08-07 — commenting out the cron above was NOT enough: an
    # external automation still fires this workflow via workflow_dispatch every
    # 15 minutes, so Buffer kept being called and every attempt failed (the IG
    # account is suspended). This guard stops the job before any runner starts.
    #
    # TO RE-ENABLE INSTAGRAM POSTING (once the account is restored):
    #   1. delete the `if: false` line below
    #   2. uncomment the `schedule:` block above
    #   3. replace `workflow_call: {}` with `workflow_dispatch: {}` above
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run poster
        id: poster
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_IG_CHANNEL_ID: ${{ secrets.BUFFER_IG_CHANNEL_ID }}
        run: python ig_post.py

      - name: Commit updated schedule
        if: steps.poster.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up posted IG entries"
          for attempt in 1 2 3; do
            git push && break
            echo "Push failed (attempt $attempt), rebasing and retrying..."
            git pull --rebase origin main
          done
